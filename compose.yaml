services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: insightai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: insightai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightai"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
  migrate:
    build: ./backend
    environment: &backend_environment
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DATABASE_URL: postgresql+psycopg://insightai:${POSTGRES_PASSWORD}@postgres:5432/insightai
      REDIS_URL: redis://redis:6379/0
      TASK_MODE: celery
      UPLOAD_DIR: /app/data/uploads
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: ./backend
    environment: *backend_environment
    volumes:
      - uploads:/app/data/uploads
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
  worker:
    build: ./backend
    environment: *backend_environment
    command: ["celery", "-A", "app.tasks.celery", "worker", "--loglevel=info", "--concurrency=2"]
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
  web:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8000
      ORIGIN: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
volumes:
  postgres_data:
  redis_data:
  uploads:
