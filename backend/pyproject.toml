[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "insightai-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1",
  "pydantic-settings>=2.6,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1",
  "celery[redis]>=5.4,<6", "python-multipart>=0.0.20,<1",
  "PyJWT>=2.10,<3", "pwdlib[argon2]>=0.2,<1",
  "pypdf>=5,<7", "openpyxl>=3.1,<4", "xlrd>=2,<3", "python-docx>=1.1,<2",
  "boto3>=1.35,<2", "Pillow>=11,<13"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]
agents = ["langgraph>=1,<2"]
ocr = ["docling>=2,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"] # FastAPI dependency injection uses Depends/File defaults.
